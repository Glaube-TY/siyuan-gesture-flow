name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const readJson = (file) => {
            try {
              return JSON.parse(fs.readFileSync(file, "utf8"));
            } catch (error) {
              console.error(`::error file=${file}::Unable to parse ${file}: ${error.message}`);
              process.exit(1);
            }
          };

          const packageJson = readJson("package.json");
          const pluginJson = readJson("plugin.json");
          const tag = process.env.RELEASE_TAG;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

          if (!semver.test(packageJson.version)) {
            console.error(`::error::Invalid SemVer in package.json: ${packageJson.version}`);
            process.exit(1);
          }
          if (packageJson.version !== pluginJson.version) {
            console.error(`::error::Version mismatch: package.json=${packageJson.version}, plugin.json=${pluginJson.version}`);
            process.exit(1);
          }
          if (tag !== `v${pluginJson.version}`) {
            console.error(`::error::Tag ${tag} does not match plugin version v${pluginJson.version}`);
            process.exit(1);
          }

          console.log(`Validated ${tag}: package.json and plugin.json are both ${pluginJson.version}.`);
          NODE

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Verify package
        run: pnpm verify

      - name: Run smoke tests
        run: pnpm test:smoke

      - name: Generate SHA-256 checksum
        run: sha256sum package.zip > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" package.zip SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" package.zip SHA256SUMS.txt \
              --verify-tag \
              --title "GestureFlow $RELEASE_TAG" \
              --generate-notes
          fi
