name: Create Release on Tag Push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Version consistency: package.json.version === plugin.json.version,
      # the tag must equal "v" + that version, and the version must be
      # valid SemVer.  Any mismatch fails the workflow before building.
      - name: Validate version consistency
        shell: bash
        run: |
          set -euo pipefail
          PKG_VER=$(node -p "require('./package.json').version")
          PLUGIN_VER=$(node -p "require('./plugin.json').version")
          echo "package.json version: $PKG_VER"
          echo "plugin.json version: $PLUGIN_VER"
          echo "tag: ${{ github.ref_name }}"
          if [ "$PKG_VER" != "$PLUGIN_VER" ]; then
            echo "::error::version mismatch: package.json=$PKG_VER plugin.json=$PLUGIN_VER"
            exit 1
          fi
          if [ "v$PLUGIN_VER" != "${{ github.ref_name }}" ]; then
            echo "::error::tag must equal v$PLUGIN_VER, got ${{ github.ref_name }}"
            exit 1
          fi
          if ! [[ "$PLUGIN_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid SemVer: $PLUGIN_VER"
            exit 1
          fi
          echo "Version consistency OK: v$PLUGIN_VER"

      # Install Node.js
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # Install pnpm (must match packageManager field exactly)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        id: pnpm-install
        with:
          version: 10.14.0
          run_install: false

      # Get pnpm store directory
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      # Setup pnpm cache
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Install dependencies (frozen lockfile for reproducible CI)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type-check production code first
      - name: Type-check
        run: pnpm check

      # Build for production, 这一步会生成一个 package.zip
      - name: Build for production
        run: pnpm build

      # Verify build artifacts
      - name: Verify build artifacts
        run: pnpm verify

      # Run the small smoke suite (after check + build + verify pass)
      - name: Run smoke tests
        run: pnpm test:smoke

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "package.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
