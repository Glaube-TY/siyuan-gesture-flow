name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Check runtime lifecycle
        run: pnpm test:lifecycle

      - name: Check native loader
        run: pnpm test:native-loader

      - name: Check native lifecycle invariants
        run: pnpm test:native-lifecycle

      - name: Build
        run: pnpm build

      - name: Verify package
        run: pnpm verify

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: siyuan-gesture-flow-build
          path: package.zip
          if-no-files-found: error

  windows-native:
    runs-on: windows-2022
    env:
      GESTURE_FLOW_REQUIRE_NATIVE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows native addon
        run: pnpm native:build
      - name: Check lifecycle, build and verify native package
        run: pnpm release:check
